<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bus Depot Management System - Secure enterprise authentication and role-based portal.">
  <title>Login | Bus Depot Management System</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-bg-decor"></div>

    <div class="login-card">
      <div class="login-header">
        <div class="brand-icon-wrapper">
          <!-- Bus Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.25V3.75a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v11.25m10.5 0v3.75m0-3.75H3.75m10.5-3.75H3.75m10.5-3.75H3.75" />
          </svg>
        </div>
        <h1>Bus Depot Management</h1>
        <p>Enterprise Fleet Operations & Scheduling Portal</p>
      </div>

      <!-- Alert / Error container -->
      <div id="alertError" class="alert-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        <span id="alertText">Invalid username or password</span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="e.g. admin or admin@depot.com"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-action">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePassword" class="toggle-password-btn" title="Toggle password visibility" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-login">
          <span id="loginSpinner" class="spinner" style="display: none;"></span>
          <span id="loginBtnText">Sign In to Depot</span>
        </button>
      </form>

      <!-- Quick Demo Access / Viva Helper -->
      <div class="demo-accounts">
        <div class="demo-title">Quick Demo Login (Click to Fill)</div>
        <div class="demo-chips">
          <button type="button" class="demo-chip" data-user="admin" data-pass="Admin@123">
            Admin
            <span>admin</span>
          </button>
          <button type="button" class="demo-chip" data-user="operations" data-pass="Ops@123">
            Operations
            <span>operations</span>
          </button>
          <button type="button" class="demo-chip" data-user="driver1" data-pass="Driver@123">
            Driver
            <span>driver1</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
